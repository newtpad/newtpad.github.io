<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newtpad</title>
  <style id="newtpad-core">
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #090a0d;
      --text-dim: #404552;
      --cyan: #0ea5e9;
      --font-mono: ui-monospace, "SF Mono", Consolas, monospace;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: #d8dee9;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .np-unhydrated {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      user-select: none;
    }
    .np-unhydrated a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed var(--cyan); }
  </style>
  <!-- Userscript injects all layout and theme rules here -->
  <style id="newtpad-theme"></style>
</head>
<body>
  <div id="root">
    <div class="np-unhydrated" id="np-standby">
      <div>NEWTPAD // CORE STANDBY</div>
      <div>Install <a href="newtpad.user.js">newtpad.user.js</a> in Violentmonkey to boot system.</div>
    </div>
  </div>

  <script>
    // Hardware Bus: Delegates key handling regardless of future UI redesigns
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.activeElement) {
        document.activeElement.blur();
      }
      if (e.key === '/') {
        const active = document.activeElement;
        const isWriting = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
        if (!isWriting) {
          const omni = document.getElementById('cmd-input') || document.querySelector('[data-np-omni]');
          if (omni) {
            e.preventDefault();
            omni.focus();
            if (omni.select) omni.select();
          }
        }
      }
    });

    window.postMessage({ type: 'NEWTPAD_HOST_READY' }, '*');
  </script>
</body>
</html>
