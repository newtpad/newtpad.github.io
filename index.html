<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newtpad</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --card-hover: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --danger: #f85149;
      --success: #238636;
      --warning: #d29922;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .status-badge {
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      color: var(--accent);
      text-decoration: none;
      user-select: none;
      transition: all 0.2s;
    }
    .status-badge.connected {
      color: var(--success);
      border-color: var(--success);
      pointer-events: none;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .search-wrapper {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }

    .dashboard {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      flex: 1;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 0.8rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Notes */
    #scratchpad {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      padding: 1rem;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: none;
      font-family: inherit;
    }

    /* Adaptive Links */
    .link-list { list-style: none; overflow-y: auto; flex: 1; }
    .link-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #21262d;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s;
    }
    .link-item:hover { background: var(--card-hover); }
    .link-stats {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .prune-btn {
      font-size: 0.7rem;
      background: rgba(248, 81, 73, 0.15);
      color: var(--danger);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .link-form { display: flex; border-top: 1px solid var(--border); }
    .link-form input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }
    .link-form button {
      background: #21262d;
      border: none;
      color: var(--accent);
      padding: 0 1rem;
      cursor: pointer;
    }

    /* News */
    .news-list { list-style: none; overflow-y: auto; max-height: 380px; }
    .news-item { padding: 0.75rem 1rem; border-bottom: 1px solid #21262d; }
    .news-item a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1.35;
      display: block;
    }
    .news-item a:hover { color: var(--accent); }
    .news-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
    
    .btn-text {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
    }
    .btn-text:hover { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <div id="clock" style="font-weight: 500; font-size: 1.1rem;">--:--</div>
    
    <!-- Real <a> element intercepted by Violentmonkey's URL matcher -->
    <a id="companion-badge" class="status-badge" href="#" target="_blank">
      <span class="dot"></span>
      <span id="badge-label">Install Companion (Violentmonkey)</span>
    </a>
  </header>

  <div class="search-wrapper">
    <form action="https://duckduckgo.com/" method="GET">
      <input class="search-input" type="text" name="q" placeholder="Search..." autofocus autocomplete="off" />
    </form>
  </div>

  <main class="dashboard">
    <!-- 1. Notes/Scratchpad -->
    <section class="panel">
      <div class="panel-header">
        <span>Scratchpad</span>
        <span id="save-indicator" style="font-size: 0.75rem;">Synced</span>
      </div>
      <textarea id="scratchpad" placeholder="Quick notes, commands, to-dos..."></textarea>
    </section>

    <!-- 2. Adaptive Smart Links -->
    <section class="panel">
      <div class="panel-header">
        <span>Frequent Links</span>
        <span style="font-size: 0.75rem;">Usage-Ranked</span>
      </div>
      <ul class="link-list" id="links-container"></ul>
      <form class="link-form" id="link-form">
        <input type="text" id="link-title" placeholder="Name" required />
        <input type="url" id="link-url" placeholder="https://..." required />
        <button type="submit">+</button>
      </form>
    </section>

    <!-- 3. News / Pulse -->
    <section class="panel" id="news-panel">
      <div class="panel-header">
        <span>Pulse</span>
        <button class="btn-text" onclick="toggleNewsPanel()">Hide Feed</button>
      </div>
      <ul class="news-list" id="news-container">
        <li class="news-item" style="color: var(--text-muted); font-size: 0.85rem;">Loading feed...</li>
      </ul>
    </section>
  </main>

  <script>
    /* =====================================================================
       1. INLINE USERSCRIPT & DIRECT INSTALL HOOK
       ===================================================================== */
    const COMPANION_SOURCE = `// ==UserScript==
// @name         Newtpad Companion
// @namespace    https://newtpad.github.io/
// @version      1.0.0
// @description  Local-first persistent engine for Newtpad
// @match        https://newtpad.github.io/*
// @match        http://localhost:*/*
// @match        file:///*
// @grant        GM_getValue
// @grant        GM_setValue
// @run-at       document-start
// ==/UserScript==

(function () {
  'use strict';
  function announce() { window.postMessage({ type: 'NEWTPAD_VM_READY' }, '*'); }
  window.addEventListener('message', async (e) => {
    if (e.source !== window || !e.data || !e.data.type) return;
    if (e.data.type === 'NEWTPAD_PING') announce();
    if (e.data.type === 'NEWTPAD_LOAD_DATA') {
      const saved = await GM_getValue('newtpad_store', null);
      window.postMessage({ type: 'NEWTPAD_DATA_LOADED', payload: saved ? JSON.parse(saved) : null }, '*');
    }
    if (e.data.type === 'NEWTPAD_SAVE_DATA') {
      await GM_setValue('newtpad_store', JSON.stringify(e.data.payload));
    }
  });
  announce();
  document.addEventListener('DOMContentLoaded', announce);
})();`;

    // Bind real Data-URI matching Violentmonkey's regex: /\.user\.js([?#].*)?$/
    const badge = document.getElementById('companion-badge');
    badge.href = 'data:text/javascript;charset=utf-8,' + 
                 encodeURIComponent(COMPANION_SOURCE) + 
                 '#newtpad.user.js';

    /* =====================================================================
       2. NEWTPAD DASHBOARD CORE LOGIC
       ===================================================================== */
    const state = {
      notes: '',
      links: [
        { title: 'GitHub', url: 'https://github.com', clicks: 8, lastUsed: Date.now() },
        { title: 'Hacker News', url: 'https://news.ycombinator.com', clicks: 3, lastUsed: Date.now() },
        { title: 'MDN Web', url: 'https://developer.mozilla.org', clicks: 0, lastUsed: Date.now() - (12 * 86400000) }
      ],
      hideNews: false,
      hasCompanion: false
    };

    // Clock
    function updateClock() {
      const d = new Date();
      document.getElementById('clock').textContent = 
        d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Data Sync
    function saveData() {
      const payload = { notes: state.notes, links: state.links, hideNews: state.hideNews };
      if (state.hasCompanion) {
        window.postMessage({ type: 'NEWTPAD_SAVE_DATA', payload }, '*');
      } else {
        localStorage.setItem('newtpad_data', JSON.stringify(payload));
      }
      const ind = document.getElementById('save-indicator');
      ind.textContent = 'Saved';
      setTimeout(() => { ind.textContent = 'Synced'; }, 800);
    }

    // Adaptive Links & Decay
    function renderLinks() {
      const list = document.getElementById('links-container');
      list.innerHTML = '';
      state.links.sort((a, b) => b.clicks - a.clicks);

      const now = Date.now();
      state.links.forEach((item, index) => {
        const li = document.createElement('li');
        const daysUnused = (now - item.lastUsed) / 86400000;
        const isStale = daysUnused > 7 && item.clicks < 2;

        li.innerHTML = `
          <a class="link-item" href="${item.url}" data-idx="${index}">
            <span>${item.title}</span>
            <div class="link-stats">
              ${isStale ? `<span class="prune-btn" data-remove="${index}">Unused: Prune?</span>` : ''}
              <span>${item.clicks} hits</span>
            </div>
          </a>
        `;
        list.appendChild(li);
      });
    }

    document.getElementById('links-container').addEventListener('click', (e) => {
      const removeIdx = e.target.getAttribute('data-remove');
      if (removeIdx !== null) {
        e.preventDefault();
        e.stopPropagation();
        state.links.splice(removeIdx, 1);
        saveData();
        renderLinks();
        return;
      }
      const linkEl = e.target.closest('.link-item');
      if (linkEl) {
        const idx = linkEl.getAttribute('data-idx');
        state.links[idx].clicks += 1;
        state.links[idx].lastUsed = Date.now();
        saveData();
      }
    });

    document.getElementById('link-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('link-title').value.trim();
      const url = document.getElementById('link-url').value.trim();
      state.links.push({ title, url, clicks: 1, lastUsed: Date.now() });
      saveData();
      renderLinks();
      e.target.reset();
    });

    // Notes
    const scratchpad = document.getElementById('scratchpad');
    scratchpad.addEventListener('input', (e) => {
      state.notes = e.target.value;
      saveData();
    });

    // News & Toggle
    function toggleNewsPanel() {
      state.hideNews = !state.hideNews;
      document.getElementById('news-panel').style.display = state.hideNews ? 'none' : 'flex';
      saveData();
    }

    function fetchNews() {
      if (state.hideNews) return;
      fetch('https://api.hnpwa.com/v0/news/1.json')
        .then(res => res.json())
        .then(items => {
          document.getElementById('news-container').innerHTML = items.slice(0, 6).map(post => `
            <li class="news-item">
              <a href="${post.url}" target="_blank" rel="noopener">${post.title}</a>
              <div class="news-meta">${post.points || 0} pts · ${post.comments_count} comments</div>
            </li>
          `).join('');
        })
        .catch(() => {
          document.getElementById('news-container').innerHTML = 
            `<li class="news-item" style="color:var(--text-muted)">Feed unavailable offline</li>`;
        });
    }

    // Handshake with Violentmonkey
    window.addEventListener('message', (e) => {
      if (e.source !== window || !e.data) return;

      if (e.data.type === 'NEWTPAD_VM_READY') {
        state.hasCompanion = true;
        badge.className = 'status-badge connected';
        badge.removeAttribute('href');
        document.getElementById('badge-label').textContent = 'Companion Active';
        window.postMessage({ type: 'NEWTPAD_LOAD_DATA' }, '*');
      }

      if (e.data.type === 'NEWTPAD_DATA_LOADED' && e.data.payload) {
        state.notes = e.data.payload.notes || '';
        state.links = e.data.payload.links || state.links;
        state.hideNews = !!e.data.payload.hideNews;
        applyState();
      }
    });

    function applyState() {
      scratchpad.value = state.notes;
      document.getElementById('news-panel').style.display = state.hideNews ? 'none' : 'flex';
      renderLinks();
    }

    // Native LocalStorage Fallback Init
    const local = localStorage.getItem('newtpad_data');
    if (local) {
      try {
        const parsed = JSON.parse(local);
        state.notes = parsed.notes || '';
        state.links = parsed.links || state.links;
        state.hideNews = !!parsed.hideNews;
      } catch (_) {}
    }
    applyState();
    fetchNews();
    window.postMessage({ type: 'NEWTPAD_PING' }, '*');
  </script>
</body>
</html>
