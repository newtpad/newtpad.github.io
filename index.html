<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <style>
    :root {
      --bg: #0e1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }
    #clock {
      font-size: 4.5rem;
      font-weight: 300;
      letter-spacing: -2px;
    }
    .search-box {
      width: min(90%, 540px);
    }
    input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .status-badge {
      font-size: 0.75rem;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f85149; /* Red until connected */
    }
    .dot.connected { background: #2ea043; }
  </style>
</head>
<body>

  <div id="clock">00:00</div>

  <form class="search-box" action="https://duckduckgo.com/" method="GET">
    <input type="text" name="q" placeholder="Search..." autofocus autocomplete="off" />
  </form>

  <div class="status-badge">
    <div class="dot" id="sync-dot"></div>
    <span id="sync-status">Companion script not detected (using basic localStorage)</span>
  </div>

  <script>
    // 1. Clock functionality
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = 
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Settings & Companion Script Bridge
    let settings = { theme: 'dark', links: [] };

    // Listen for messages from Violentmonkey
    window.addEventListener('message', (event) => {
      if (event.source !== window) return;

      if (event.data.type === 'NEWTPAD_VM_READY') {
        document.getElementById('sync-dot').classList.add('connected');
        document.getElementById('sync-status').textContent = 'Companion script connected';
        
        // Request persistent data from Violentmonkey
        window.postMessage({ type: 'NEWTPAD_LOAD_SETTINGS' }, '*');
      }

      if (event.data.type === 'NEWTPAD_SETTINGS_LOADED') {
        settings = event.data.payload || settings;
        console.log('Synced settings:', settings);
      }
    });

    // Helper: Saves data through Userscript (if present) or falls back to standard localStorage
    function saveSettings(newSettings) {
      settings = newSettings;
      // Tell Violentmonkey to save via GM_setValue
      window.postMessage({ type: 'NEWTPAD_SAVE_SETTINGS', payload: settings }, '*');
      // Fallback
      localStorage.setItem('newtpad_settings', JSON.stringify(settings));
    }
  </script>
</body>
</html>
