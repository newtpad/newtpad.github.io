<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newtpad</title>
  
  <style id="newtpad-theme">
    :root {
      --bg: #090a0d;
      --surface: #111318;
      --surface-raised: #171a21;
      --border: #232732;
      --border-focus: #3e4456;
      --text: #d8dee9;
      --text-muted: #6b7280;
      --text-dim: #404552;
      --amber: #d97706;
      --amber-dim: #78350f;
      --cyan: #0ea5e9;
      --green: #10b981;
      --red: #ef4444;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 2rem;
      gap: 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .header-title { font-weight: 700; letter-spacing: 0.05em; color: var(--text-muted); }
    .clock-display { font-feature-settings: "tnum" 1; color: var(--text); }

    .cmd-bar { position: relative; display: flex; align-items: center; width: 100%; }
    .cmd-prefix { position: absolute; left: 1rem; color: var(--text-dim); font-family: var(--font-mono); pointer-events: none; }
    .cmd-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border-radius: 4px;
      outline: none;
    }
    .cmd-input:focus { border-color: var(--border-focus); }

    .app-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 1.25rem;
      flex: 1;
    }
    @media (max-width: 960px) { .app-grid { grid-template-columns: 1fr; } }

    .slot-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 440px;
    }
    .slot-header {
      background: var(--surface-raised);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
    }
    .slot-body { flex: 1; display: flex; flex-direction: column; position: relative; overflow-y: auto; }

    .native-pad {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      padding: 1rem;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    .link-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-decoration: none;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }
    .link-row:hover { background: var(--surface-raised); }

    .unhydrated {
      padding: 1.5rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .unhydrated a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed var(--cyan); }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .footer-actions { display: flex; gap: 1rem; }
    .footer-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; }
    .footer-btn:hover { color: var(--text); }
  </style>
</head>
<body>

  <header id="app-header">
    <div class="header-left">
      <span class="header-title">NEWTPAD</span>
      <span class="clock-display" id="clock">00:00:00</span>
    </div>
    <div id="companion-indicator" style="color: var(--text-dim);">
      [STANDALONE DB]
    </div>
  </header>

  <div class="cmd-bar" id="cmd-bar">
    <span class="cmd-prefix">&gt;</span>
    <input type="text" id="cmd-input" class="cmd-input" placeholder="Type a search or URL... ([TAB] to toggle)" autocomplete="off" spellcheck="false" />
  </div>

  <main class="app-grid" id="main-grid">
    <!-- Slot 1: Notes -->
    <section class="slot-panel">
      <div class="slot-header">
        <span>01 // SCRATCHPAD</span>
        <span id="scratchpad-meta">SAVED</span>
      </div>
      <div class="slot-body" id="slot-scratchpad">
        <textarea id="native-scratchpad" class="native-pad" placeholder="Type notes here..."></textarea>
      </div>
    </section>

    <!-- Slot 2: Links -->
    <section class="slot-panel">
      <div class="slot-header">
        <span>02 // FREQUENT ACCESS</span>
        <span id="links-meta">LOCAL</span>
      </div>
      <div class="slot-body" id="slot-links"></div>
    </section>

    <!-- Slot 3: Live Pulse / Open Tabs Feed -->
    <section class="slot-panel">
      <div class="slot-header">
        <span>03 // PULSE FEED</span>
        <span id="feed-meta">STANDBY</span>
      </div>
      <div class="slot-body" id="slot-feed">
        <div class="unhydrated">
          Operating in standalone mode.<br /><br />
          Install <a href="newtpad.user.js">newtpad.user.js</a> in Violentmonkey to link cross-tab presence and formula math.
        </div>
      </div>
    </section>
  </main>

  <footer id="slot-dock">
    <div id="dock-left">SYSTEM OK</div>
    <div class="footer-actions">
      <button class="footer-btn" id="btn-export">[EXPORT DB]</button>
      <input type="file" id="file-import" style="display: none;" />
      <button class="footer-btn" id="btn-import">[IMPORT DB]</button>
      <span>|</span>
      <span>[TAB] FOCUS</span>
    </div>
  </footer>

  <script>
    (() => {
      'use strict';

      // --- SECTION: SOVEREIGN DATABASE SCHEMA (Version 1.0) ---
      const DB_KEY = 'newtpad_database';
      const DEFAULT_DB = {
        version: 1.0,
        exportedAt: null,
        blocks: [
          {
            id: "blk_1",
            title: "WELCOME",
            content: "• Standalone persistence is active.\n• Install the companion userscript for cross-tab sync and calculations.\n• Export/Import your database at any time from the bottom right.",
            collapsed: false,
            type: "note"
          }
        ],
        links: [
          { id: "lnk_1", title: "GitHub", url: "https://github.com/", hits: 10, lastUsed: Date.now() },
          { id: "lnk_2", title: "DuckDuckGo", url: "https://duckduckgo.com/", hits: 5, lastUsed: Date.now() }
        ],
        settings: {
          defaultSearchEngine: "google",
          staleDaysThreshold: 10,
          staleHitsThreshold: 2
        }
      };

      // Load or Initialize Database
      window.__np_get_db = () => {
        try {
          const raw = localStorage.getItem(DB_KEY);
          return raw ? Object.assign({}, DEFAULT_DB, JSON.parse(raw)) : DEFAULT_DB;
        } catch(e) {
          return DEFAULT_DB;
        }
      };

      window.__np_set_db = (newDb) => {
        try {
          localStorage.setItem(DB_KEY, JSON.stringify(newDb));
        } catch(e) {}
      };

      let db = window.__np_get_db();

      // Clock
      const clock = document.getElementById('clock');
      function tick() {
        const d = new Date();
        clock.textContent = d.toTimeString().split(' ')[0];
      }
      setInterval(tick, 1000);
      tick();

      // Render Scratchpad (Standalone)
      const pad = document.getElementById('native-scratchpad');
      if (db.blocks && db.blocks[0]) {
        pad.value = db.blocks[0].content;
      }
      pad.addEventListener('input', () => {
        if (!db.blocks[0]) db.blocks[0] = { id: 'blk_1', title: 'NOTES', content: '', collapsed: false, type: 'note' };
        db.blocks[0].content = pad.value;
        window.__np_set_db(db);
      });

      // Render Links (Standalone)
      function renderHostLinks() {
        const container = document.getElementById('slot-links');
        if (!container) return;
        container.innerHTML = db.links.map(l => `
          <a class="link-row" href="${l.url}">
            <span>${l.title}</span>
            <span style="color:var(--text-dim); font-size:0.7rem;">${l.hits} hits</span>
          </a>
        `).join('');
      }
      renderHostLinks();

      // Hotkeys
      let lastFocus = null;
      const cmd = document.getElementById('cmd-input');
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          if (document.activeElement === cmd) {
            if (lastFocus && lastFocus.focus) lastFocus.focus();
            else cmd.blur();
          } else {
            lastFocus = document.activeElement;
            cmd.focus();
            cmd.select();
          }
        }
        if (e.key === 'Escape' && document.activeElement) {
          document.activeElement.blur();
        }
      });

      cmd.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && cmd.value.trim()) {
          const val = cmd.value.trim();
          if (val.startsWith('http://') || val.startsWith('https://')) window.location.href = val;
          else if (val.includes('.') && !val.includes(' ')) window.location.href = 'https://' + val;
          else window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
        }
      });

      // Data Portability: Export / Import
      document.getElementById('btn-export').onclick = () => {
        db.exportedAt = new Date().toISOString();
        const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `newtpad_database_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      };

      const fileIn = document.getElementById('file-import');
      document.getElementById('btn-import').onclick = () => fileIn.click();
      fileIn.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const imported = JSON.parse(evt.target.result);
            if (imported.blocks && imported.links) {
              db = imported;
              window.__np_set_db(db);
              if (db.blocks[0]) pad.value = db.blocks[0].content;
              renderHostLinks();
              alert('Database restored successfully.');
            }
          } catch(err) {
            alert('Invalid database JSON file.');
          }
        };
        reader.readAsText(file);
      };
    })();
  </script>
</body>
</html>
